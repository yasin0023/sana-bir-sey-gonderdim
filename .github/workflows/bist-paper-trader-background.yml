name: BIST Paper Trader Background Run

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC; weekdays during the approximate BIST session.
    - cron: "*/15 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-paper-trader-background
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bist-sanal-trader/requirements.txt
      - name: Install dependencies
        run: pip install -r bist-sanal-trader/requirements.txt
      - name: Run paper strategy
        run: python bist-sanal-trader/background_trader.py
      - name: Persist virtual portfolio and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bist-sanal-trader/paper_portfolio.json bist-sanal-trader/paper_report.json
          if git diff --cached --quiet; then
            echo "No portfolio/report changes to commit."
          else
            git commit -m "Update BIST paper trading state"
            git push
          fi
