name: Crypto Paper Trader
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/crypto-paper-trader.yml'
      - 'bist-sanal-trader/crypto_background_trader.py'
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: crypto-paper-trader
  cancel-in-progress: false
jobs:
  paper-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Run crypto paper trader
        run: python bist-sanal-trader/crypto_background_trader.py
      - name: Save paper portfolio and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bist-sanal-trader/crypto_portfolio.json bist-sanal-trader/crypto_report.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Update crypto paper trading report"
            git push
          fi
