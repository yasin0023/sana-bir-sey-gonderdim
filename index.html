<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sana Bir Şey Gönderdim 🎁</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
    radial-gradient(circle at top,#762557 0%,#29102f 45%,#100914 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(15px);
    border-radius:28px;
    padding:30px 24px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.gift{
    font-size:68px;
    margin-bottom:10px;
}

h1{
    font-size:30px;
    margin:10px 0;
}

h2{
    font-size:28px;
}

p{
    line-height:1.6;
}

.muted{
    opacity:.75;
}

input{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:14px;
    font-size:17px;
    outline:none;
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:0;
    border-radius:14px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    background:white;
    color:#32152f;
}

button:active{
    transform:scale(.98);
}

.whatsapp{
    background:#25D366;
    color:white;
}

.secondary{
    background:rgba(255,255,255,.15);
    color:white;
}

.link-box{
    margin-top:15px;
    padding:14px;
    border-radius:12px;
    background:rgba(0,0,0,.25);
    word-break:break-all;
    font-size:13px;
}

.hidden{
    display:none!important;
}

.countdown{
    font-size:85px;
    font-weight:bold;
    margin:25px 0;
}

.reveal{
    animation:reveal .7s ease;
}

@keyframes reveal{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.small{
    font-size:12px;
    opacity:.5;
    margin-top:20px;
}

.success{
    color:#8affc1;
    font-size:14px;
    margin-top:10px;
}

.shake{
    font-size:64px;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    font-size:13px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- GÖNDEREN -->
<div class="card" id="senderScreen">

    <div class="gift">🎁</div>

    <h1>Sana Bir Şey Gönderdim</h1>

    <p class="muted">
        Bir arkadaşına küçük bir sürpriz gönder. 😏
    </p>

    <input
        id="friendName"
        type="text"
        maxlength="40"
        placeholder="Arkadaşının adı"
    >

    <button onclick="createSurprise()">
        🎁 Sürprizi Hazırla
    </button>

    <p class="small">
        Demo • Henüz ödeme yok
    </p>

</div>


<!-- PAYLAŞ -->
<div class="card hidden" id="shareScreen">

    <div class="gift">🔐</div>

    <h2>Hazır! 😏</h2>

    <p>
        <strong id="friendNameResult"></strong> için
        sürpriz hazırlandı.
    </p>

    <div class="link-box" id="generatedLink"></div>

    <button onclick="copyLink()">
        🔗 Linki Kopyala
    </button>

    <button class="whatsapp" onclick="sendWhatsApp()">
        💬 WhatsApp'tan Gönder
    </button>

    <div class="success" id="copyMessage"></div>

    <button class="secondary" onclick="location.href=location.pathname">
        🔄 Yeni Sürpriz
    </button>

</div>


<!-- ALICI -->
<div class="card hidden" id="receiverScreen">

    <div class="gift">🎁</div>

    <span class="badge">
        Sana özel bir şey var
    </span>

    <h2 id="receiverTitle">
        Bakalım neymiş... 👀
    </h2>

    <p class="muted">
        Açmadan önce hazır olduğundan emin ol.
    </p>

    <div class="countdown" id="countdown">
        3
    </div>

</div>


<!-- SONUÇ -->
<div class="card hidden" id="resultScreen">

    <div class="reveal">

        <div class="shake" id="resultEmoji">
            😂
        </div>

        <span class="badge" id="resultBadge">
            Sürpriz!
        </span>

        <h2 id="helloText"></h2>

        <div id="jokeContent"></div>

        <button onclick="location.href=location.pathname">
            😎 Ben de Birine Göndereyim
        </button>

    </div>

</div>

</div>


<script>

/* URL'den ismi al */
const params = new URLSearchParams(window.location.search);
const receiverName = params.get("to");


/* Sayfa ?to= ile açıldıysa alıcı ekranı */
if(receiverName){

    const name = receiverName;

    document.getElementById("senderScreen")
        .classList.add("hidden");

    document.getElementById("receiverScreen")
        .classList.remove("hidden");

    startCountdown(name);
}


/* Sürpriz oluştur */
function createSurprise(){

    const input =
        document.getElementById("friendName");

    const name =
        input.value.trim();

    if(!name){

        alert("Önce arkadaşının adını yaz 😄");

        input.focus();

        return;
    }

    const url =
        window.location.origin +
        window.location.pathname +
        "?to=" +
        encodeURIComponent(name);

    document.getElementById("friendNameResult")
        .textContent=name;

    document.getElementById("generatedLink")
        .textContent=url;

    document.getElementById("senderScreen")
        .classList.add("hidden");

    document.getElementById("shareScreen")
        .classList.remove("hidden");
}


/* Link kopyala */
function copyLink(){

    const link =
        document.getElementById("generatedLink")
        .textContent;

    navigator.clipboard.writeText(link)
        .then(function(){

            document.getElementById("copyMessage")
                .textContent =
                "✅ Link kopyalandı!";

        })
        .catch(function(){

            alert(
                "Linki kopyalayamadı. Link:\n\n" +
                link
            );

        });
}


/* WhatsApp */
function sendWhatsApp(){

    const link =
        document.getElementById("generatedLink")
        .textContent;

    const name =
        document.getElementById("friendNameResult")
        .textContent;

    const message =
        "Sana bir şey gönderdim. Aç bakalım 👀🎁\n\n" +
        link;

    const whatsappURL =
        "https://wa.me/?text=" +
        encodeURIComponent(message);

    window.open(
        whatsappURL,
        "_blank"
    );
}


/* 3-2-1 */
function startCountdown(name){

    let count=3;

    const countdown =
        document.getElementById("countdown");

    countdown.textContent=count;

    const timer =
        setInterval(function(){

            count--;

            countdown.textContent=count;

            if(count<=0){

                clearInterval(timer);

                document.getElementById("receiverScreen")
                    .classList.add("hidden");

                document.getElementById("resultScreen")
                    .classList.remove("hidden");

                showRandomJoke(name);
            }

        },1000);
}


/* Rastgele şaka */
function showRandomJoke(name){

    const jokes=[

        {
            emoji:"🏆",
            badge:"BÜYÜK ÖDÜL",
            title:"TEBRİKLER! 🎉",
            html:`
                <p style="font-size:24px;font-weight:bold;">
                    Büyük ödülü kazandın!
                </p>

                <p>
                    🏆 Ödülün:
                    <strong>Hiçbir şey.</strong>
                </p>

                <p class="muted">
                    Ama arkadaşın sana 1 TL harcadı. 😂
                </p>
            `
        },

        {
            emoji:"🚨",
            badge:"ACİL DURUM",
            title:"Hey "+escapeHTML(name)+"! 🚨",
            html:`
                <p style="font-size:24px;font-weight:bold;">
                    Arkadaşın senin hakkında
                    önemli bir karar verdi...
                </p>

                <p>
                    3... 2... 1...
                </p>

                <p>
                    😂 Sana 1 TL'lik bir şaka gönderdi.
                </p>
            `
        },

        {
            emoji:"💸",
            badge:"PARA İADESİ",
            title:"Kötü haber "+escapeHTML(name)+"... 😂",
            html:`
                <p style="font-size:24px;font-weight:bold;">
                    Arkadaşın sana 1 TL harcadı.
                </p>

                <p>
                    İyi haber:
                    <strong>Paran güvende.</strong>
                </p>

                <p>
                    Kötü haber:
                    <strong>Para zaten senin değildi. 😂</strong>
                </p>
            `
        }

    ];


    const joke =
        jokes[
            Math.floor(
                Math.random()*jokes.length
            )
        ];


    document.getElementById("resultEmoji")
        .textContent=joke.emoji;

    document.getElementById("resultBadge")
        .textContent=joke.badge;

    document.getElementById("helloText")
        .innerHTML=joke.title;

    document.getElementById("jokeContent")
        .innerHTML=joke.html;
}


/* Güvenli isim gösterimi */
function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
